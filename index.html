<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusPROJECT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ... (ВСТАВЬ СЮДА ВСЕ СВОИ СТИЛИ ИЗ ПРЕДЫДУЩЕГО КОДА) ... */
    /* Я оставлю только новые стили, а ты просто скопируй их в свой тег <style> */
    
    /* Уведомления */
    .notif-wrapper { position: relative; margin-right: 15px; }
    .notif-btn { background: transparent; border: none; color: #b8b6b4; font-size: 18px; cursor: pointer; position: relative; }
    .notif-btn:hover { color: #fff; }
    .notif-badge { position: absolute; top: -5px; right: -8px; background: #ff6b6b; color: white; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 10px; display: none; }
    
    .notif-dropdown { display: none; position: absolute; top: 35px; right: 0; width: 280px; background: #1b2838; border: 1px solid #2a475e; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); z-index: 1000; }
    .notif-dropdown.active { display: block; }
    .notif-header { padding: 12px; border-bottom: 1px solid #2a3f4e; font-weight: bold; color: #fff; }
    .notif-item { padding: 15px; border-bottom: 1px solid #2a3f4e; color: #c7d5e0; font-size: 13px; }
    .notif-item:last-child { border: none; }
    .notif-actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-approve { background: #4c6b22; color: #beee11; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-deny { background: #5c2a2a; color: #ff6b6b; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    /* Модалка загрузки для лаунчера */
    .launcher-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; color: white; }
    .launcher-overlay.active { display: flex; }
    .spinner { border: 4px solid #2a475e; border-top: 4px solid #66c0f4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- ТВОЙ HEADER И ОСТАЛЬНОЙ КОД... -->
  
  <!-- ВСТАВЬ ЭТО В HEADER РЯДОМ С КНОПКАМИ АВТОРИЗАЦИИ: -->
  <div class="header-right">
    <div class="search-box">...</div>
    
    <!-- УВЕДОМЛЕНИЯ -->
    <div class="notif-wrapper">
      <button type="button" class="notif-btn" onclick="toggleNotifs()">
        <i class="fas fa-bell"></i>
        <span class="notif-badge" id="notifBadge">1</span>
      </button>
      <div class="notif-dropdown" id="notifDropdown">
        <div class="notif-header">Уведомления</div>
        <div id="notifList">
          <!-- Сюда падают запросы -->
          <div class="notif-item" style="color: #8f98a0;">Нет новых уведомлений</div>
        </div>
      </div>
    </div>

    <div id="authButtons" style="display:flex; gap:10px;">...</div>
    <!-- ... -->
  </div>

  <!-- МОДАЛКА ПОДТВЕРЖДЕНИЯ ДЛЯ ЛАУНЧЕРА (скрыта по умолчанию) -->
  <div class="launcher-overlay" id="launcherOverlay">
    <h2>Запрос от Лаунчера</h2>
    <p style="margin: 15px 0; color: #8fbbd9;">Подтвердите вход в приложении</p>
    <div style="display: flex; gap: 15px;">
      <button class="btn-approve" onclick="confirmLauncherLogin()">Да, это я</button>
      <button class="btn-deny" onclick="closeLauncher()">Отмена</button>
    </div>
  </div>

  <script>
    // --- НОВАЯ ЛОГИКА УВЕДОМЛЕНИЙ ---
    
    function toggleNotifs() {
      var dropdown = document.getElementById('notifDropdown');
      dropdown.classList.toggle('active');
    }

    // Проверяем, запущен ли сайт из лаунчера (передался ли параметр в ссылке)
    // Например: index.html?launcher_id=NP-123456
    window.onload = function() {
      var urlParams = new URLSearchParams(window.location.search);
      var launcherId = urlParams.get('launcher_id');
      
      if (launcherId) {
        // Если пришли из лаунчера
        document.getElementById('notifBadge').style.display = 'block';
        document.getElementById('notifList').innerHTML = `
          <div class="notif-item">
            <b>Лаунчер Nexus</b> запрашивает вход для профиля <b style="color:#66c0f4">${launcherId}</b>. Это вы?
            <div class="notif-actions">
              <button class="btn-approve" onclick="showLauncherModal('${launcherId}')">Да</button>
              <button class="btn-deny" onclick="clearNotifs()">Нет</button>
            </div>
          </div>
        `;
      }
    };

    function showLauncherModal(id) {
      document.getElementById('launcherOverlay').classList.add('active');
      // В реальности тут мы бы отправляли запрос на сервер, 
      // но так как сервера нет, мы просто меняем URL обратно на успешный.
      window.pendingLauncherId = id;
    }

    function confirmLauncherLogin() {
      var overlay = document.getElementById('launcherOverlay');
      overlay.innerHTML = '<div class="spinner"></div><h2>Успешно!</h2><p>Можете вернуться в лаунчер.</p>';
      
      // Имитируем отправку успеха
      setTimeout(() => {
        // Если открыто в лаунчере, меняем URL на ?login_success=true
        // C# код перехватит это изменение URL!
        window.location.href = window.location.pathname + '?login_success=true&id=' + window.pendingLauncherId;
      }, 1500);
    }

    function closeLauncher() {
      document.getElementById('launcherOverlay').classList.remove('active');
    }

    function clearNotifs() {
      document.getElementById('notifBadge').style.display = 'none';
      document.getElementById('notifList').innerHTML = '<div class="notif-item" style="color: #8f98a0;">Нет новых уведомлений</div>';
    }
  </script>
</body>
</html>
